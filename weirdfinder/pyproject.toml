[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weirdfinder"
version = "0.1.0"
description = "Find weird, obscure games on Steam and itch.io and sync them to a Google Sheet."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "gspread>=6.0",
    "google-auth>=2.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
weirdfinder = "weirdfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
weirdfinder = ["config.example.toml"]
